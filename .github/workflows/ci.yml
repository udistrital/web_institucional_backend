name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict --no-interaction
      - run: php -l web/sites/default/settings.php
      - run: php -l web/index.php
